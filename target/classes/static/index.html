
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpO2 Monitoring System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: #123b60;
            color: white;
            padding: 22px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 16px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 3px 12px #00000012;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
        }

        .status {
            font-weight: bold;
            font-size: 20px;
        }

        .normal { color: #16803c; }
        .warning { color: #b77900; }
        .critical { color: #c62828; }
        .invalid { color: #555; }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #123b60;
            color: white;
            cursor: pointer;
        }

        #history {
            line-height: 1.9;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
<header>
    <h1>SpO₂ Monitoring System</h1>
    <p>Wearable Oxygen Saturation Dashboard</p>
</header>

<main>
    <div class="cards">
        <section class="card">
            <h2>Oxygen Saturation</h2>
            <div class="value" id="spo2">--%</div>
            <div class="status" id="status">Waiting for reading</div>
        </section>

        <section class="card">
            <h2>Heart Rate</h2>
            <div class="value" id="pulse">-- BPM</div>
            <p>Simulated demo value</p>
        </section>
    </div>

    <section class="card" style="margin-top:20px">
        <h2>Alert Message</h2>
        <p id="message">No reading received yet.</p>
        <button onclick="nextReading()">Next demo reading</button>
    </section>

    <section class="card" style="margin-top:20px">
        <h2>Reading History</h2>
        <div id="history">No readings yet.</div>
    </section>
</main>

<script>
    const readings = [98, 97, 94, 92, 88, 96, 105];
    let index = 0;
    const history = [];

    function nextReading() {
        const spo2 = readings[index % readings.length];
        const pulse = 72 + (index % 15);

        let status;
        let message;
        let css;

        if (spo2 < 0 || spo2 > 100) {
            status = "INVALID";
            message = "Invalid reading. Check the sensor.";
            css = "invalid";
        } else if (spo2 < 90) {
            status = "CRITICAL";
            message = "Very low reading. Seek medical assessment.";
            css = "critical";
        } else if (spo2 < 95) {
            status = "WARNING";
            message = "Low reading. Recheck the measurement.";
            css = "warning";
        } else {
            status = "NORMAL";
            message = "Reading is within the configured range.";
            css = "normal";
        }

        document.getElementById("spo2").textContent = spo2 + "%";
        document.getElementById("pulse").textContent = pulse + " BPM";

        const statusElement = document.getElementById("status");
        statusElement.textContent = status;
        statusElement.className = "status " + css;

        document.getElementById("message").textContent = message;

        const time = new Date().toLocaleTimeString();
        history.unshift(`${time} | ${spo2}% | ${status}`);
        document.getElementById("history").innerHTML =
            history.map(item => {
                const line = document.createElement("div");
                line.textContent = item;
                return line;
            }).reduce((container, line) => {
                container.appendChild(line);
                return container;
            }, document.createElement("div")).innerHTML;

        index++;
    }

    nextReading();
</script>

<script>
async function updateReading() {
    try {
        const response = await fetch("/api/spo2");

        if (!response.ok) {
            throw new Error("Backend error");
        }

        const data = await response.json();

        document.getElementById("spo2").textContent =
            data.spo2 + "%";

        document.getElementById("pulse").textContent =
            data.heartRate + " BPM";

        const statusElement = document.getElementById("status");
        statusElement.textContent = data.status;
        statusElement.className =
            "status " + data.status.toLowerCase();

        document.getElementById("message").textContent =
            "[" + data.mode + "] " + data.message;

    } catch (error) {
        document.getElementById("status").textContent =
            "CONNECTION ERROR";

        document.getElementById("message").textContent =
            "Please start the Java backend.";
    }
}

updateReading();
setInterval(updateReading, 3000);
</script>

</body>
</html>
